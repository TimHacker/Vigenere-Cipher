<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigenère Cipher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Vigenère Cipher</h1>
    <p class="intro">Encrypt a message with a keyword, then decrypt it again.</p>

    <form id="cipher-form" novalidate>
      <div class="field">
        <label for="message">Plain text message</label>
        <textarea id="message" rows="4" placeholder="Attack at dawn!"></textarea>
      </div>

      <div class="field">
        <label for="key">Encryption key</label>
        <input id="key" type="text" autocomplete="off" spellcheck="false"
               placeholder="LEMON" aria-describedby="key-hint error">
        <small id="key-hint">Letters only, e.g. LEMON</small>
      </div>

      <div class="actions">
        <button id="encrypt" type="submit">Encrypt</button>
        <button id="decrypt" type="button" disabled>Decrypt</button>
        <button id="compare" type="button" hidden>Compare</button>
      </div>
    </form>

    <p id="error" class="error" role="alert"></p>
    <p id="compare-success" class="success" role="status" hidden>✅ Decrypted message matches the original.</p>

    <div class="field">
      <label for="result" id="result-label">Result</label>
      <output id="result" for="message key" aria-live="polite"></output>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
